<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 60" width="460" height="60">
  <defs>
    <linearGradient id="rcci-grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#008da6" />
      <stop offset="100%" stop-color="#005d73" />
    </linearGradient>
    <linearGradient id="rcci-grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  <!-- Logo Emblem -->
  <g transform="translate(4, 4)">
    <circle cx="26" cy="26" r="25" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
    <!-- Outer orbiting arc -->
    <path d="M 12 26 A 14 14 0 1 1 38 34" fill="none" stroke="url(#rcci-grad1)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 38 26 A 14 14 0 0 1 18 38" fill="none" stroke="url(#rcci-grad2)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Small orbiting node -->
    <circle cx="38" cy="18" r="3" fill="#008da6" />
    <circle cx="15" cy="35" r="2.5" fill="#f59e0b" />
    <!-- Center text -->
    <text x="26" y="29.5" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#005d73" letter-spacing="0.5">RCCI</text>
  </g>
  <!-- Text Section -->
  <g transform="translate(68, 14)">
    <!-- Chinese Title -->
    <text x="0" y="16" font-family="'Noto Sans TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="18.5" font-weight="700" fill="#1e293b" letter-spacing="0.5">
      中央研究院 <tspan dx="4" font-weight="600" fill="#0f172a">關鍵議題研究中心</tspan>
    </text>
    <!-- English Subtitle -->
    <text x="0" y="32" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#64748b" letter-spacing="0.3">
      Research Center for Critical Issues <tspan fill="#94a3b8">|</tspan> Academia Sinica
    </text>
  </g>
</svg>
